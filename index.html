<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fun Counting Game 🎉</title>
<style>
    body {
        font-family: Arial, sans-serif;
        text-align: center;
        background: linear-gradient(to bottom, #a8e6ff, #fff);
        margin: 0;
        padding: 20px;
    }
    h1 {
        font-size: 2.5em;
    }
    .game-container {
        margin-top: 20px;
    }
    .images {
        font-size: 50px;
        margin: 20px;
    }
    button {
        font-size: 24px;
        margin: 10px;
        padding: 15px 25px;
        border-radius: 10px;
        border: none;
        cursor: pointer;
    }
    .correct {
        background-color: #4CAF50;
        color: white;
    }
    .wrong {
        background-color: #f44336;
        color: white;
    }
    .mode-btn {
        background-color: #2196F3;
        color: white;
    }
</style>
</head>

<body>

<h1>🎈 Counting Game 🎈</h1>

<p>Choose Player:</p>
<button class="mode-btn" onclick="setMode(5)">Kid 1 (Up to 5)</button>
<button class="mode-btn" onclick="setMode(10)">Kid 2 (Up to 10)</button>

<div class="game-container" id="game" style="display:none;">
    <h2 id="question"></h2>
    <div class="images" id="images"></div>
    <div id="answers"></div>
    <button onclick="speak()">🔊 Read</button>
    <h2 id="result"></h2>
</div>

<script>
let maxNumber = 5;
let correctAnswer = 0;
let currentEmoji = "";

function setMode(num) {
    maxNumber = num;
    document.getElementById("game").style.display = "block";
    nextQuestion();
}

function nextQuestion() {
    const emojis = ["🚗", "🦄", "🦆"]; // car, unicorn, psyduck vibe
    currentEmoji = emojis[Math.floor(Math.random() * emojis.length)];

    correctAnswer = Math.floor(Math.random() * maxNumber) + 1;

    document.getElementById("question").innerText = "How many?";
    document.getElementById("images").innerText = currentEmoji.repeat(correctAnswer);

    let answersHTML = "";
    for (let i = 1; i <= maxNumber; i++) {
        answersHTML += `<button onclick="checkAnswer(${i})">${i}</button>`;
    }
    document.getElementById("answers").innerHTML = answersHTML;
    document.getElementById("result").innerText = "";
}

function checkAnswer(num) {
    if (num === correctAnswer) {
        document.getElementById("result").innerHTML = `
            <span style="color:green;">🎉 Correct! 🎉</span><br>
            <img src="https://upload.wikimedia.org/wikipedia/en/1/1a/Charizard.png" width="150">
        `;
    } else {
        document.getElementById("result").innerHTML = `
            <span style="color:red;">Try Again 😊</span><br>
            <img src="https://upload.wikimedia.org/wikipedia/en/3/39/Psyduck.png" width="150">
        `;
    }
    setTimeout(nextQuestion, 2000);
}

function speak() {
    const msg = new SpeechSynthesisUtterance("How many?");
    speechSynthesis.speak(msg);
}
</script>

</body>
</html>
