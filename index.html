<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Princess Counting Game</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      text-align: center;
      background: linear-gradient(to bottom, #dff6ff, #f9e6ff);
      color: #274472;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
    }

    h1 {
      font-size: 2.2rem;
      color: #7b4bb7;
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 1.2rem;
      margin-bottom: 20px;
    }

    .game-box {
      background: rgba(255,255,255,0.9);
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 8px 18px rgba(0,0,0,0.12);
    }

    .princess {
      font-size: 4rem;
      margin-bottom: 10px;
    }

    .question {
      font-size: 1.8rem;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .items {
      font-size: 2.4rem;
      min-height: 90px;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .answers {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }

    button {
      font-size: 1.4rem;
      padding: 16px;
      border: none;
      border-radius: 18px;
      background: #ffd9f7;
      color: #5b2d84;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    button:hover {
      transform: scale(1.04);
    }

    .message {
      font-size: 1.5rem;
      min-height: 40px;
      margin-bottom: 15px;
      font-weight: bold;
    }

    .score {
      font-size: 1.2rem;
      margin-bottom: 15px;
    }

    .reward {
      font-size: 2rem;
      min-height: 40px;
      margin-top: 10px;
    }

    .next-btn {
      display: none;
      background: #cfe8ff;
      color: #204060;
    }

    @media (max-width: 700px) {
      .answers {
        grid-template-columns: repeat(2, 1fr);
      }

      .question {
        font-size: 1.4rem;
      }

      .items {
        font-size: 2rem;
      }

      button {
        font-size: 1.2rem;
        padding: 14px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>❄️ Princess Counting Game 👑</h1>
    <div class="subtitle">Count the snowflakes and pick the right number!</div>

    <div class="game-box">
      <div class="princess" id="princessFace">👸❄️</div>
      <div class="score">Stars: <span id="score">0</span> ⭐</div>
      <div class="question">How many snowflakes are there?</div>
      <div class="items" id="items"></div>
      <div class="answers" id="answers"></div>
      <div class="message" id="message"></div>
      <button class="next-btn" id="nextBtn">Next</button>
      <div class="reward" id="reward"></div>
    </div>
  </div>

  <script>
    const itemsEl = document.getElementById("items");
    const answersEl = document.getElementById("answers");
    const messageEl = document.getElementById("message");
    const scoreEl = document.getElementById("score");
    const nextBtn = document.getElementById("nextBtn");
    const rewardEl = document.getElementById("reward");
    const princessFace = document.getElementById("princessFace");

    let correctAnswer = 1;
    let score = 0;

    function shuffle(array) {
      return array.sort(() => Math.random() - 0.5);
    }

    function generateRound() {
      messageEl.textContent = "";
      rewardEl.textContent = "";
      nextBtn.style.display = "none";
      princessFace.textContent = "👸❄️";

      correctAnswer = Math.floor(Math.random() * 10) + 1;

      let icons = "";
      for (let i = 0; i < correctAnswer; i++) {
        icons += "❄️ ";
      }
      itemsEl.textContent = icons;

      let choices = new Set();
      choices.add(correctAnswer);

      while (choices.size < 4) {
        choices.add(Math.floor(Math.random() * 10) + 1);
      }

      const finalChoices = shuffle([...choices]);
      answersEl.innerHTML = "";

      finalChoices.forEach(choice => {
        const btn = document.createElement("button");
        btn.textContent = choice;
        btn.onclick = () => checkAnswer(choice);
        answersEl.appendChild(btn);
      });
    }

    function disableButtons() {
      const buttons = answersEl.querySelectorAll("button");
      buttons.forEach(btn => btn.disabled = true);
    }

    function checkAnswer(choice) {
      if (choice === correctAnswer) {
        score++;
        scoreEl.textContent = score;
        messageEl.textContent = "Yay! You got it right!";
        rewardEl.textContent = "✨ Magic Star! ✨";
        princessFace.textContent = "👸🌟";
        disableButtons();
        nextBtn.style.display = "inline-block";
      } else {
        messageEl.textContent = "Try again, princess 💖";
        rewardEl.textContent = "❄️";
        princessFace.textContent = "👸";
      }
    }

    nextBtn.addEventListener("click", generateRound);

    generateRound();
  </script>
</body>
</html>
