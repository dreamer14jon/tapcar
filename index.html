<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sports Car Tap Game</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(180deg, #dff5ff, #fff5e8);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      color: #243447;
    }
    .game {
      width: 100%;
      max-width: 760px;
      background: #fff;
      border-radius: 24px;
      box-shadow: 0 14px 30px rgba(0,0,0,0.12);
      padding: 20px;
      text-align: center;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 2rem;
    }
    .subtitle {
      font-size: 1.05rem;
      margin-bottom: 14px;
    }
    .topbar {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .pill {
      background: #eef8ff;
      border-radius: 999px;
      padding: 10px 14px;
      font-weight: bold;
    }
    .instruction {
      font-size: 1.6rem;
      font-weight: bold;
      margin: 14px 0 18px;
    }
    .road {
      background: linear-gradient(180deg, #aee7ff 0 45%, #6d7683 45% 100%);
      border-radius: 24px;
      padding: 18px 14px 24px;
      position: relative;
      overflow: hidden;
      min-height: 330px;
    }
    .cloud {
      position: absolute;
      font-size: 2rem;
      opacity: 0.85;
    }
    .cloud.one { top: 12px; left: 24px; }
    .cloud.two { top: 14px; right: 28px; }
    .choices {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      margin-top: 60px;
      margin-bottom: 18px;
    }
    .card {
      border: none;
      border-radius: 22px;
      min-height: 118px;
      background: rgba(255,255,255,0.88);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 12px;
      transition: transform 0.12s ease;
    }
    .card:active {
      transform: scale(0.98);
    }
    .emoji {
      font-size: 3.6rem;
      line-height: 1;
    }
    .label {
      font-size: 1rem;
      font-weight: bold;
    }
    .lane-line {
      height: 10px;
      width: 100%;
      background: repeating-linear-gradient(90deg, #fff 0 42px, transparent 42px 72px);
      border-radius: 999px;
    }
    .status {
      min-height: 34px;
      font-size: 1.25rem;
      font-weight: bold;
      margin: 14px 0 8px;
    }
    .happy {
      font-size: 3rem;
      margin-top: 8px;
      display: none;
    }
    .happy.show {
      display: block;
    }
    .next-btn {
      border: none;
      border-radius: 18px;
      padding: 14px 18px;
      font-size: 1.15rem;
      font-weight: bold;
      background: #ffd36f;
      color: #4a3500;
      cursor: pointer;
      display: none;
      margin-top: 10px;
    }
    @media (max-width: 560px) {
      h1 { font-size: 1.7rem; }
      .instruction { font-size: 1.3rem; }
      .choices { gap: 10px; }
      .card { min-height: 102px; }
      .emoji { font-size: 3rem; }
      .label { font-size: 0.95rem; }
    }
  </style>
</head>
<body>
  <div class="game">
    <h1>🏎️ Tap the Sports Car</h1>
    <div class="subtitle">A simple game for little kids.</div>

    <div class="topbar">
      <div class="pill">Stars: <span id="score">0</span> ⭐</div>
      <div class="pill">Round: <span id="round">1</span></div>
    </div>

    <div class="instruction">Tap the sports car!</div>

    <div class="road">
      <div class="cloud one">☁️</div>
      <div class="cloud two">☁️</div>

      <div class="choices" id="choices"></div>
      <div class="lane-line"></div>
    </div>

    <div class="status" id="status"></div>
    <div class="happy" id="happy">😊🎉⭐</div>
    <button class="next-btn" id="nextBtn">Next Round</button>
  </div>

  <script>
    const options = [
      { emoji: '🏎️', label: 'Sports Car', type: 'sports' },
      { emoji: '🚗', label: 'Car', type: 'other' },
      { emoji: '🚕', label: 'Taxi', type: 'other' },
      { emoji: '🚓', label: 'Police Car', type: 'other' },
      { emoji: '🚙', label: 'Big Car', type: 'other' },
      { emoji: '🚌', label: 'Bus', type: 'other' },
      { emoji: '🚚', label: 'Truck', type: 'other' }
    ];

    let score = 0;
    let round = 1;
    let correctIndex = 0;

    const choicesEl = document.getElementById('choices');
    const statusEl = document.getElementById('status');
    const scoreEl = document.getElementById('score');
    const roundEl = document.getElementById('round');
    const happyEl = document.getElementById('happy');
    const nextBtn = document.getElementById('nextBtn');

    function shuffle(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function makeRound() {
      statusEl.textContent = '';
      happyEl.classList.remove('show');
      nextBtn.style.display = 'none';
      choicesEl.innerHTML = '';
      roundEl.textContent = round;

      const sports = options.find(item => item.type === 'sports');
      const others = shuffle(options.filter(item => item.type === 'other')).slice(0, 3);
      const roundChoices = shuffle([sports, ...others]);
      correctIndex = roundChoices.findIndex(item => item.type === 'sports');

      roundChoices.forEach((item, index) => {
        const btn = document.createElement('button');
        btn.className = 'card';
        btn.type = 'button';
        btn.innerHTML = `<div class="emoji">${item.emoji}</div><div class="label">${item.label}</div>`;
        btn.addEventListener('click', () => choose(index));
        choicesEl.appendChild(btn);
      });
    }

    function choose(index) {
      const buttons = choicesEl.querySelectorAll('.card');

      if (index === correctIndex) {
        buttons.forEach(btn => btn.disabled = true);
        score += 1;
        scoreEl.textContent = score;
        statusEl.textContent = 'Yay! You found it!';
        happyEl.classList.add('show');
        nextBtn.style.display = 'inline-block';
        round += 1;
      } else {
        statusEl.textContent = 'Try again!';
      }
    }

    nextBtn.addEventListener('click', makeRound);
    makeRound();
  </script>
</body>
</html>
